<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>infographic</title>
<style>
  :root{
    --teal-deep:#0b2f2c; --teal:#134e4a; --mint:#5eead4; --mint-soft:#99f6e4;
    --sand:#d4a574; --sand-soft:#f2c98a; --paper:#fbfbf8; --paper-soft:#eefaf6; --ink:#16302d;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:__W__px;height:__H__px;overflow:hidden;}
  body{
    font-family:-apple-system,"SF Pro Text","Helvetica Neue",Arial,"DejaVu Sans",sans-serif;
    background:radial-gradient(1000px 700px at 88% -6%, rgba(94,234,212,.22), transparent 60%),
               linear-gradient(170deg,var(--paper) 0%, var(--paper-soft) 100%);
    color:var(--ink); position:relative; padding:70px 66px 56px;
    display:flex; flex-direction:column;
  }
  .kicker{
    font-size:28px; font-weight:800; letter-spacing:.16em; text-transform:uppercase;
    color:#0f766e; margin-bottom:18px;
  }
  h1{ font-size:64px; font-weight:800; line-height:1.08; color:var(--teal-deep); margin-bottom:16px; max-width:940px;}
  h1 em{ font-style:normal; color:#0d9488; }
  .lead{ font-size:32px; font-weight:500; color:#2d4d47; line-height:1.4; max-width:900px; margin-bottom:34px;}
  .takeaway{
    background:linear-gradient(120deg,var(--teal-deep),var(--teal));
    color:var(--paper); border-radius:32px; padding:38px 44px; margin-bottom:40px;
    font-size:38px; font-weight:700; line-height:1.32;
    box-shadow:0 18px 40px rgba(11,47,44,.20);
  }
  .takeaway em{ font-style:normal; color:var(--mint-soft); }
  .rows{ display:flex; flex-direction:column; gap:26px; flex:1; }
  .row{ display:flex; gap:28px; align-items:flex-start; }
  .num{
    flex:0 0 auto; width:66px; height:66px; border-radius:20px;
    background:var(--paper); border:3px solid var(--mint); color:#0f766e;
    display:flex; align-items:center; justify-content:center;
    font-size:32px; font-weight:800;
  }
  .rowtext{ flex:1; }
  .rowtitle{ font-size:34px; font-weight:800; color:var(--teal-deep); margin-bottom:6px; }
  .rowdesc{ font-size:27px; font-weight:500; color:#3a5850; line-height:1.36; }
  .footer{
    margin-top:34px; display:flex; align-items:center; justify-content:space-between;
    border-top:2px solid rgba(19,78,74,.14); padding-top:24px;
  }
  .brand{ display:flex; align-items:center; gap:14px; font-size:26px; font-weight:800; color:var(--teal-deep); letter-spacing:.02em;}
  .dot{width:16px;height:16px;border-radius:50%;background:var(--sand);}
  .date{ font-size:24px; font-weight:600; color:#5c7a73; }
</style>
</head>
<body>
  <div class="kicker">__KICKER__</div>
  <h1>__TITLE__</h1>
  <div class="lead">__LEAD__</div>
  <div class="takeaway">__TAKEAWAY__</div>
  <div class="rows">
__ROWS__
  </div>
  <div class="footer">
    <div class="brand"><span class="dot"></span>MILAGPT STUDIO</div>
    <div class="date">__DATE__</div>
  </div>
</body>
</html>
