<!doctype html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<title>__TITLE__</title>
<link rel="stylesheet" href="__FONTS__">
<style>
  :root{
    --paper:#f4eddc; --paper-2:#efe5cf; --graphite:#2a2826; --lead:#5b5751;
    --teal:#2f6b66; --sepia:#8a6440; --rule:rgba(42,40,38,.14);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1350px;overflow:hidden;background:#d9cfb8}
  body{font-family:"PT Sans","DejaVu Sans",Arial,sans-serif;color:var(--graphite);position:relative}
  .sheet{position:absolute;inset:26px;clip-path:__DECKLE__;
    background:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='600'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' seed='__SEED__'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .3  0 0 0 0 .22  0 0 0 .09 0'/></filter><rect width='600' height='600' filter='url(%23n)'/></svg>"),
      radial-gradient(1200px 900px at 30% 20%, var(--paper), var(--paper-2));}
  .ticks{position:absolute;left:58px;top:120px;bottom:120px;width:22px;
    background:repeating-linear-gradient(to bottom,var(--rule) 0 2px,transparent 2px 24px);}
  .ticks::after{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;
    background:repeating-linear-gradient(to bottom,var(--rule) 0 2px,transparent 2px 120px);}
  .cross{position:absolute;width:40px;height:40px;opacity:.5}
  .cross::before,.cross::after{content:"";position:absolute;background:var(--lead)}
  .cross::before{left:19px;top:0;width:1.5px;height:40px}
  .cross::after{top:19px;left:0;height:1.5px;width:40px}
  .c1{right:70px;top:70px}.c2{left:66px;bottom:150px}
  svg.frame{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  /* CARD-V2-0925: каталожная карточка — значок типа, двойная линия шапки, линовка поля */
  .glyph{position:absolute;left:100px;top:70px;width:118px;height:118px}
  .glyph path,.glyph circle{fill:none;stroke:var(--graphite);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .glyph .t{stroke:var(--teal)}
  .n{position:absolute;left:240px;top:80px;font-family:Caveat,cursive;font-size:44px;color:var(--lead)}
  .kicker{position:absolute;left:240px;right:260px;top:140px;font-size:27px;font-weight:700;line-height:1.2;color:var(--teal)}
  .rules{position:absolute;left:92px;right:88px;top:262px;bottom:112px;
    background:repeating-linear-gradient(transparent 0 71px,rgba(47,107,102,.13) 71px 73px)}
  .type{position:absolute;right:92px;top:132px;font-family:Caveat,cursive;font-size:40px;color:var(--sepia);
    padding:2px 22px;border:2.5px solid var(--sepia);border-radius:48% 52% 45% 55%/55% 45% 55% 45%;transform:rotate(-3deg)}
  .dots{position:absolute;right:104px;top:204px;display:flex;gap:10px}
  .dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--lead)}
  .dots i.on{background:var(--lead)}
  .body{position:absolute;left:112px;right:100px;top:270px;bottom:250px;display:flex;flex-direction:column;justify-content:center;gap:34px}
  .front{font-weight:700;line-height:1.14}
  .front .gap{display:inline-block;min-width:200px;border-bottom:4px solid var(--teal);color:transparent}
  .hint{font-family:Caveat,cursive;font-size:42px;color:var(--teal)}
  .answer{font-weight:700;line-height:1.2}
  .answer mark{background:linear-gradient(transparent 58%,rgba(47,107,102,.28) 58%);color:inherit}
  ul.points{list-style:none;display:flex;flex-direction:column;gap:18px}
  ul.points li{font-size:44px;font-weight:700;line-height:1.2;padding-left:58px;position:relative}
  ul.points li::before{content:"";position:absolute;left:4px;top:10px;width:30px;height:30px;
    border:3px solid var(--teal);border-radius:6px 9px 5px 8px;transform:rotate(-4deg)}
  .why{font-family:Caveat,cursive;font-size:44px;line-height:1.1;color:var(--teal)}
  .src{position:absolute;left:112px;right:100px;bottom:120px;font-size:26px;line-height:1.35;color:var(--sepia);
    border-left:3px solid var(--sepia);padding-left:22px}
  .src b{font-weight:700;letter-spacing:.04em}
  .src q{font-style:italic}
  .brand{position:absolute;right:100px;bottom:62px;font-size:22px;font-weight:700;letter-spacing:.14em;color:var(--lead);opacity:.75}
  .flip{position:absolute;left:112px;bottom:62px;font-family:Caveat,cursive;font-size:34px;color:var(--lead);opacity:.8}
  .art{max-height:360px;max-width:100%;object-fit:contain;align-self:center;mix-blend-mode:multiply}
</style>
</head>
<body>
<div class="sheet">
  <svg class="frame" viewBox="0 0 1028 1298" preserveAspectRatio="none">
    <defs><filter id="rough"><feTurbulence type="fractalNoise" baseFrequency=".022" numOctaves="2" seed="__SEED__"/>
      <feDisplacementMap in="SourceGraphic" scale="7"/></filter></defs>
    <g filter="url(#rough)" fill="none" stroke="#2a2826" stroke-linecap="round">
      <rect x="46" y="46" width="936" height="1206" rx="26" stroke-width="3.2" opacity=".78"/>
      <rect x="54" y="52" width="922" height="1196" rx="30" stroke-width="1.4" opacity=".38"/>
      <path d="M86 226 H 942" stroke="#8a6440" stroke-width="2.4" opacity=".75"/>
      <path d="M86 234 H 942" stroke="#8a6440" stroke-width="1.4" opacity=".6"/>
    </g>
  </svg>
  <div class="ticks"></div>
  <div class="rules"></div>
  <svg class="glyph" viewBox="0 0 44 44" aria-hidden="true">__GLYPH__</svg>
  <div class="cross c1"></div><div class="cross c2"></div>
  <div class="n">__INDEX__ / __TOTAL__</div>
  <div class="kicker">__KICKER__</div>
  <div class="type">__TYPE__</div>
  <div class="dots">__DOTS__</div>
  <div class="body">__BODY__</div>
  __SRC__
  <div class="flip">__FLIP__</div>
  <div class="brand">MILAGPT · STUDIO</div>
</div>
</body>
</html>
