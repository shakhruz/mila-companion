<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d6cbb2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1d1c1a" media="(prefers-color-scheme: dark)">
<title>__TITLE__</title>
<style>
/*__FONTS__*/
/* Тренажёр MILAGPT Studio v2 (25.09.2026): карта = линованная каталожная карточка на столе,
   переворот 3D, свайпы на телефоне, клавиатура на десктопе, экран итога сессии. */
:root{
  --desk:#d6cbb2; --desk-line:rgba(42,40,38,.07);
  --paper:#f3ecdb; --paper-hi:#faf6ec; --rule:rgba(47,107,102,.16); --head:#8a6440;
  --ink:#2a2826; --lead:#6a655d; --teal:#2f6b66; --sepia:#8a6440; --red:#b23a2e;
  --btn:#faf6ec; --shadow:rgba(42,40,38,.22);
}
@media (prefers-color-scheme:dark){:root{
  --desk:#1d1c1a; --desk-line:rgba(236,228,210,.05);
  --paper:#2b2926; --paper-hi:#33302c; --rule:rgba(124,193,184,.13); --head:#c9a27a;
  --ink:#ece4d2; --lead:#b3ab9b; --teal:#7cc1b8; --sepia:#d0a878; --red:#e3806f;
  --btn:#2f2d29; --shadow:rgba(0,0,0,.45);
}}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
html,body{min-height:100%;background:var(--desk);color:var(--ink);
  font-family:"PT Sans","DejaVu Sans",-apple-system,Arial,sans-serif}
body{background-image:linear-gradient(var(--desk-line) 1px,transparent 1px),linear-gradient(90deg,var(--desk-line) 1px,transparent 1px);
  background-size:24px 24px;overflow-x:hidden}
.wrap{max-width:560px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px 0;min-height:100dvh;display:flex;flex-direction:column}
button,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}

/* шапка: название + кольцо прогресса */
.top{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.top h1{font-size:19px;line-height:1.2;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.top p{font-size:13px;line-height:1.3;color:var(--lead);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ring{position:relative;width:54px;height:54px;flex:none}
.ring svg{width:54px;height:54px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:4}
.ring .bg{stroke:var(--desk-line);stroke:rgba(128,120,104,.28)}
.ring .fg{stroke:var(--teal);stroke-linecap:round;transition:stroke-dashoffset .35s}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:700;letter-spacing:-.01em}

/* режимы и инструменты — одна строка */
.tools{display:flex;gap:8px;align-items:center;margin:12px 0 14px}
.seg{display:flex;flex:1;min-width:0;background:rgba(250,246,236,.55);border:1.5px solid rgba(42,40,38,.18);border-radius:12px;padding:3px}
@media (prefers-color-scheme:dark){.seg{background:rgba(43,41,38,.7);border-color:rgba(236,228,210,.14)}}
.seg button{flex:1;min-width:0;border:0;background:none;border-radius:9px;padding:8px 4px;font-size:14px;color:var(--lead);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button[aria-pressed=true]{background:var(--paper-hi);color:var(--ink);font-weight:700;box-shadow:0 1px 0 var(--shadow)}
.ico{position:relative;flex:none;width:44px;height:44px;border-radius:12px;border:1.5px solid rgba(42,40,38,.18);background:rgba(250,246,236,.55);display:grid;place-items:center}
@media (prefers-color-scheme:dark){.ico{background:rgba(43,41,38,.7);border-color:rgba(236,228,210,.14)}}
.ico svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ico b{position:absolute;right:3px;bottom:2px;font-size:9.5px;font-weight:700;color:var(--teal)}
.ico select{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:16px}

/* сцена и карта */
.stage{flex:1;display:flex;flex-direction:column;min-height:0}
.deck{position:relative;flex:1;min-height:360px;max-height:560px;perspective:1600px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.deck .under{position:absolute;inset:10px 6px -6px 10px;background:var(--paper);border-radius:6px;box-shadow:0 1px 0 var(--shadow);opacity:.55;transform:rotate(1.2deg)}
.card{position:absolute;inset:0;outline:none;transition:transform .28s cubic-bezier(.2,.7,.2,1)}
.card.drag{transition:none}
.inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.2,.75,.2,1);transform-style:preserve-3d}
.card.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:6px;
  background:
    linear-gradient(transparent 71px,var(--head) 71px,var(--head) 72.5px,transparent 72.5px,transparent 75px,var(--head) 75px,var(--head) 76px,transparent 76px),
    repeating-linear-gradient(transparent 0 33px,var(--rule) 33px 34px) 0 76px/100% calc(100% - 76px) no-repeat,
    var(--paper);
  box-shadow:0 1px 0 var(--shadow),0 10px 24px -14px var(--shadow);
  padding:92px 22px 64px;display:flex;flex-direction:column;justify-content:center;gap:14px;overflow:hidden}
.back{transform:rotateY(180deg)}
.card:focus-visible .face{outline:3px solid var(--teal);outline-offset:3px}
.head{position:absolute;top:14px;left:18px;right:18px;height:48px;display:flex;align-items:center;gap:10px}
.glyph{width:44px;height:44px;flex:none}
.glyph path,.glyph circle,.glyph rect{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.glyph .t{stroke:var(--teal)}
.kind{font-family:Caveat,cursive;font-size:23px;color:var(--sepia);line-height:1}
.num{margin-left:auto;text-align:right;font-family:Caveat,cursive;font-size:22px;color:var(--lead);line-height:1}
.dots{display:flex;gap:4px;justify-content:flex-end;margin-top:4px}
.dots i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--lead)}
.dots i.on{background:var(--lead)}
.q{font-size:clamp(21px,5.6vw,26px);font-weight:700;line-height:1.25;text-wrap:balance}
.q.s{font-size:clamp(18px,4.8vw,22px)}
.a{font-size:clamp(19px,5vw,23px);font-weight:700;line-height:1.3}
.a.s{font-size:clamp(16px,4.3vw,19px)}
.a.plain{font-weight:400;font-size:17px}
.hint,.why{font-family:Caveat,cursive;font-size:22px;line-height:1.1;color:var(--teal)}
.gap{display:inline-block;min-width:88px;border-bottom:3px solid var(--teal);color:transparent}
mark{background:linear-gradient(transparent 58%,rgba(47,107,102,.3) 58%);color:inherit}
ul.pts{list-style:none;display:flex;flex-direction:column;gap:9px}
ul.pts li{font-size:18px;font-weight:700;padding-left:28px;position:relative;line-height:1.25}
ul.pts li::before{content:"";position:absolute;left:0;top:3px;width:16px;height:16px;border:2px solid var(--teal);border-radius:3px 5px 3px 4px;transform:rotate(-4deg)}
.src{position:absolute;left:18px;right:18px;bottom:14px;font-size:12.5px;line-height:1.3;color:var(--sepia);border-left:2px solid var(--sepia);padding-left:10px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tap{position:absolute;bottom:16px;left:0;right:0;text-align:center;font-family:Caveat,cursive;font-size:20px;color:var(--lead)}
/* штамп при свайпе */
.stamp{position:absolute;top:96px;padding:4px 14px;border:3px solid;border-radius:10px;font-family:Caveat,cursive;font-size:30px;font-weight:700;opacity:0;pointer-events:none;z-index:3;backface-visibility:hidden}
.stamp.k{left:22px;color:var(--teal);transform:rotate(-8deg)}
.stamp.m{right:22px;color:var(--red);transform:rotate(8deg)}

/* нижняя панель под большой палец */
.bar{position:sticky;bottom:0;margin:14px -16px 0;padding:10px 16px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(to bottom,transparent,var(--desk) 22%)}
.btn{display:block;width:100%;min-height:52px;border-radius:14px;border:2px solid var(--ink);background:var(--btn);font-size:17px;font-weight:700;box-shadow:0 2px 0 var(--shadow)}
.btn:active{transform:translateY(1px);box-shadow:none}
.rate{display:grid;grid-template-columns:1fr .8fr 1fr;gap:8px}
.rate .btn{font-size:15.5px;padding:0 6px;line-height:1.15}
.rate .m{border-color:var(--red);color:var(--red)}
.rate .h{border-color:var(--lead);color:var(--lead);font-weight:400}
.rate .k{border-color:var(--teal);background:var(--teal);color:var(--paper-hi)}
.link{display:block;margin:8px auto 0;border:0;background:none;color:var(--lead);font-size:14px;text-decoration:underline;text-underline-offset:3px;padding:8px 12px;min-height:40px}
.hintline{text-align:center;font-size:12.5px;color:var(--lead);margin-top:6px}
[hidden]{display:none!important}

/* итог сессии */
.sum{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:12px 2px 8px}
.sum h2{font-size:26px;line-height:1.15}
.tally{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tally div{background:var(--paper);border-radius:6px;padding:12px 8px 10px;text-align:center;box-shadow:0 1px 0 var(--shadow)}
.tally b{display:block;font-size:30px;line-height:1}
.tally span{display:block;font-size:13px;color:var(--lead);margin-top:4px}
.tally .k b{color:var(--teal)}.tally .m b{color:var(--red)}
.sum h3{font-family:Caveat,cursive;font-weight:700;font-size:24px;color:var(--sepia)}
.sum ol{padding-left:22px;display:flex;flex-direction:column;gap:6px;font-size:15px;line-height:1.3}
.next{font-size:15px;line-height:1.4;border-left:3px solid var(--teal);padding-left:12px}
.sum .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sum .row .btn{font-size:15.5px}
.sum .btn.alt{background:none}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:88vw;z-index:9}
.toast.on{opacity:1}
footer{text-align:center;color:var(--lead);font-size:11.5px;padding:4px 0 10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (min-width:700px){.wrap{padding-top:28px}.deck{min-height:440px}.top h1{font-size:22px}}
@media (prefers-reduced-motion:reduce){
  .inner,.card,.ring .fg{transition:none}
  .card.flipped .inner{transform:none}
  .back{transform:none;opacity:0}.card.flipped .back{opacity:1}.card.flipped .front{opacity:0}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div><h1 id="t"></h1><p id="st"></p></div>
    <div class="ring" role="img" id="ringbox">
      <svg viewBox="0 0 54 54" aria-hidden="true"><circle class="bg" cx="27" cy="27" r="23"/><circle class="fg" id="rg" cx="27" cy="27" r="23" stroke-dasharray="144.5" stroke-dashoffset="144.5"/></svg>
      <span id="rn">0/0</span>
    </div>
  </header>
  <div class="tools">
    <div class="seg" role="group" id="modes">
      <button data-mode="due" aria-pressed="true"></button>
      <button data-mode="all" aria-pressed="false"></button>
      <button data-mode="missed" aria-pressed="false"></button>
    </div>
    <label class="ico" id="langbox">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.6 2.4 3.6 5.3 3.6 8.5s-1 6.1-3.6 8.5M12 3.5C9.4 5.9 8.4 8.8 8.4 12s1 6.1 3.6 8.5"/></svg>
      <b id="lcode"></b>
      <select id="lang"></select>
    </label>
    <button class="ico" id="shuf"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h3.5c3.5 0 5.5 10 9 10H20M4 17h3.5c1.4 0 2.5-1.5 3.4-3.2M20 7h-3.5c-1.3 0-2.4 1.3-3.3 2.9M17.5 4.5 20 7l-2.5 2.5M17.5 14.5 20 17l-2.5 2.5"/></svg></button>
  </div>
  <main class="stage" id="stage" aria-live="polite"></main>
  <footer id="ft"></footer>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
var D = /*__DECK__*/null;
var BOX_DAYS = [0, 1, 3, 7, 14, 30];
var KEY = "fc-" + D.id;
var RM = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
var st = load();
var lang = st.lang && D.langs.indexOf(st.lang) >= 0 ? st.lang : D.langs[0];
var mode = "due", queue = [], pos = 0, sess = {know: [], hard: [], miss: []}, flipped = false, cur = null;
function load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {cards:{}}; } catch(e){ return {cards:{}}; } }
function save(){ try { st.lang = lang; localStorage.setItem(KEY, JSON.stringify(st)); } catch(e){} }
function L(k){ var t = (D.l10n[lang] || {})[k]; return t == null ? ((D.l10n.ru || {})[k] || k) : t; }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
var CL = /\{\{(?:c\d+::)?(.+?)(?:::(.+?))?\}\}/g;
function plain(s){ return String(s || "").replace(CL, "$1"); }
function clozeF(s){ return esc(s).replace(CL, function(_, a){ return '<span class="gap">' + a + "</span>"; }); }
function clozeB(s){ return esc(s).replace(CL, function(_, a){ return "<mark>" + a + "</mark>"; }); }
function rec(id){ return st.cards[id] || (st.cards[id] = {box:0, due:0, miss:0}); }
function now(){ return Date.now(); }
function card(id){ for (var i = 0; i < D.cards.length; i++) if (D.cards[i].id === id) return D.cards[i]; }
function side(c){ return c[lang] || c[D.langs[0]]; }
function locale(){ return {ru:"ru-RU", en:"en-GB", uz_latn:"uz-Latn-UZ", uz_cyrl:"uz-Cyrl-UZ"}[lang] || "ru-RU"; }
function date(ts){ try { return new Date(ts).toLocaleDateString(locale(), {day:"numeric", month:"long"}); } catch(e){ return new Date(ts).toLocaleDateString(); } }

/* нарисованные значки типа карты — карандашом, с лёгкой неровностью */
var GLYPH = {
  qa: '<path d="M16 17c0-4.5 3.4-7.3 7.4-7.3 4.2 0 7.2 2.7 7.2 6.3 0 3.4-2.5 4.9-4.6 6.1-1.8 1-2.6 2.1-2.6 4.4"/><circle class="t" cx="23.3" cy="32.6" r="1.3"/><path d="M6.5 22.5c.4-9 7-15.3 16.3-15.6 9.9-.3 15.9 6.8 15.6 15.4-.3 9.6-7.6 15.4-16.4 15-3-.1-5.4-.8-7.6-2l-6.3 2.3 2-5.6c-2.4-2.6-3.8-6-3.6-9.5z"/>',
  cloze: '<path d="M11 10c-3 .5-3.5 2.5-3.5 5.5v4c0 1.8-1 2.8-2.8 3 1.8.2 2.8 1.2 2.8 3v4c0 3 .5 5 3.5 5.5M33 10c3 .5 3.5 2.5 3.5 5.5v4c0 1.8 1 2.8 2.8 3-1.8.2-2.8 1.2-2.8 3v4c0 3-.5 5-3.5 5.5"/><path class="t" d="M14.5 27.5c4.6-.6 10.3-.5 15.2.2"/><path d="M15 18.5h14"/>',
  explain: '<path d="M8 12.5c0-2.6 1.8-4 4.4-4.2 6.5-.4 13.4-.4 19.6 0 2.6.2 4.2 1.8 4.2 4.3v12.3c0 2.5-1.6 4-4.2 4.2-4.3.3-8.1.3-12.3.2l-7.4 6 1.1-6.2c-3.4-.3-5.2-1.8-5.3-4.3-.2-4.1-.2-8.1-.1-12.3z"/><path class="t" d="M13.5 15.5c5.8-.3 11.6-.3 17.2 0M13.5 20.5c4.5-.2 9-.2 13.5.1M13.5 25.4c3.1-.1 6.2 0 9.2.1"/>'
};
function glyph(t){ return '<svg class="glyph" viewBox="0 0 44 44" aria-hidden="true">' + (GLYPH[t] || GLYPH.qa) + "</svg>"; }

function build(){
  var ids = D.cards.map(function(c){ return c.id; });
  if (mode === "due") ids = ids.filter(function(id){ return rec(id).due <= now(); });
  if (mode === "missed") ids = ids.filter(function(id){ return rec(id).miss > 0; });
  queue = ids; pos = 0; sess = {know: [], hard: [], miss: []}; render();
}
function chrome(){
  document.documentElement.lang = lang.slice(0, 2);
  document.getElementById("t").textContent = D.titles[lang] || "";
  document.getElementById("st").textContent = D.subtitles[lang] || (D.source_doc || {}).title || "";
  var b = document.querySelectorAll("[data-mode]");
  for (var i = 0; i < b.length; i++){ var m = b[i].getAttribute("data-mode"); b[i].textContent = L(m); b[i].setAttribute("aria-pressed", m === mode); }
  document.getElementById("modes").setAttribute("aria-label", L("mode"));
  document.getElementById("shuf").setAttribute("aria-label", L("shuffle")); document.getElementById("shuf").title = L("shuffle");
  document.getElementById("lang").setAttribute("aria-label", L("language"));
  document.getElementById("lcode").textContent = {ru:"RU", en:"EN", uz_latn:"UZ", uz_cyrl:"ЎЗ"}[lang] || lang.toUpperCase();
  var done = Math.min(pos, queue.length), tot = queue.length;
  document.getElementById("rn").textContent = done + "/" + tot;
  document.getElementById("rg").style.strokeDashoffset = 144.5 * (1 - (tot ? done / tot : 1));
  document.getElementById("ringbox").setAttribute("aria-label", L("progress").replace("{n}", done).replace("{t}", tot));
  document.getElementById("ft").textContent = L("footer");
}
function render(){
  chrome();
  var stage = document.getElementById("stage");
  if (pos >= queue.length){ summary(stage); return; }
  var c = card(queue[pos]), s = side(c), t = c.type || "qa", src = c.source || {};
  cur = c; flipped = false;
  var n = {easy:1, medium:2, hard:3}[c.difficulty || "medium"] || 2, dots = "";
  for (var k = 0; k < 3; k++) dots += '<i class="' + (k < n ? "on" : "") + '"></i>';
  function head(kind){ return '<div class="head">' + glyph(t) + '<span class="kind">' + esc(kind) + '</span><div class="num">№ ' + (D.cards.indexOf(c) + 1) +
             '<div class="dots" aria-label="' + esc(L("difficulty")) + " " + n + '/3">' + dots + "</div></div></div>"; }
  var f, bk, long = plain(s.front).length > 110;
  if (t === "cloze"){ f = '<div class="q' + (long ? " s" : "") + '">' + clozeF(s.front) + "</div>"; bk = '<div class="a' + (long ? " s" : "") + '">' + clozeB(s.front) + "</div>" + (s.back ? '<div class="a plain">' + esc(s.back) + "</div>" : ""); }
  else if (t === "explain"){ f = '<div class="hint">' + esc(L("explain_front")) + '</div><div class="q' + (long ? " s" : "") + '">' + esc(s.front) + "</div>"; bk = '<ul class="pts">' + s.points.map(function(p){ return "<li>" + esc(p) + "</li>"; }).join("") + "</ul>"; }
  else { f = '<div class="q' + (long ? " s" : "") + '">' + esc(s.front) + "</div>"; bk = '<div class="a' + ((s.back || "").length > 150 ? " s" : "") + '">' + esc(s.back) + "</div>"; }
  if (s.hint && t !== "explain") f += '<div class="hint">' + esc(s.hint) + "</div>";
  if (s.why) bk += '<div class="why">' + esc(L("why")) + " " + esc(s.why) + "</div>";
  var doc = (D.source_doc || {}).title;
  stage.innerHTML =
    '<div class="deck"><div class="under"></div>' +
    '<div class="card" tabindex="0" role="button" aria-label="' + esc(L("flip")) + '"><div class="inner">' +
      '<div class="face front">' + head(L(t)) + f + '<div class="tap">' + esc(L("flip_f")) + "</div></div>" +
      '<div class="face back">' + head(L("answer")) + bk + '<div class="src"><b>' + esc(L("src")) + ":</b> " + (doc ? esc(doc) + ", " : "") + esc(src.section) + " — «" + esc(src.quote) + "»</div></div>" +
    '</div><div class="stamp k">' + esc(L("know")) + '</div><div class="stamp m">' + esc(L("again")) + "</div></div></div>" +
    '<div class="bar">' +
      '<button class="btn show">' + esc(L("show")) + "</button>" +
      '<div class="rate" hidden><button class="btn m" data-r="miss">' + esc(L("again")) + '</button><button class="btn h" data-r="hard">' + esc(L("hard")) + '</button><button class="btn k" data-r="know">' + esc(L("know")) + "</button></div>" +
      '<div class="hintline" id="hl">' + esc(L(window.matchMedia("(pointer:coarse)").matches ? "swipe_hint" : "key_hint")) + "</div>" +
      '<button class="link ask">' + esc(L("ask")) + "</button>" +
    "</div>";
  var el = stage.querySelector(".card");
  stage.querySelector(".show").onclick = flip;
  stage.querySelectorAll("[data-r]").forEach(function(btn){ btn.onclick = function(){ rate(btn.getAttribute("data-r")); }; });
  stage.querySelector(".ask").onclick = ask;
  el.onkeydown = function(e){ if (e.key === " " || e.key === "Enter"){ e.preventDefault(); flip(); } };
  drag(el);
}
function flip(){
  var el = document.querySelector(".card"); if (!el) return;
  flipped = !flipped; el.classList.toggle("flipped", flipped);
  document.querySelector(".rate").hidden = !flipped; document.querySelector(".show").hidden = flipped;
  var hl = document.getElementById("hl"); if (hl) hl.hidden = !flipped && !window.matchMedia("(pointer:coarse)").matches;
  if (flipped) document.querySelector(".rate .k").focus({preventScroll: true});
}
function rate(r){
  if (!cur) return;
  var x = rec(cur.id);
  if (r === "know"){ x.box = Math.min(x.box + 1, 5); sess.know.push(cur.id); }
  else if (r === "hard"){ sess.hard.push(cur.id); }
  else { x.box = 0; x.miss++; sess.miss.push(cur.id); if (queue.slice(pos + 1).indexOf(cur.id) < 0) queue.push(cur.id); }
  x.due = now() + BOX_DAYS[x.box] * 864e5;
  save(); pos++;
  var el = document.querySelector(".card");
  if (el && !RM){
    var dx = r === "know" ? 1 : r === "miss" ? -1 : 0;
    el.style.transform = "translate(" + (dx * 130) + "%," + (dx ? "-4%" : "-30%") + ") rotate(" + (dx * 16) + "deg)";
    el.style.opacity = "0";
    setTimeout(render, 220);
  } else render();
}
function ask(){
  if (!cur) return;
  var s = side(cur), txt = L("ask") + ": «" + plain(s.front) + "» (" + (D.titles[lang] || "") + ")";
  try { navigator.clipboard.writeText(txt); } catch(e){}
  toast(L("copied"));
  if (D.ask_bot) setTimeout(function(){ location.href = "https://t.me/" + D.ask_bot.replace("@", ""); }, 900);
}
/* свайпы: вправо — знаю, влево — повторить, вверх — спросить; до переворота горизонтальный свайп переворачивает */
function drag(el){
  var x0 = 0, y0 = 0, dx = 0, dy = 0, on = false, moved = false;
  var sk = el.querySelector(".stamp.k"), sm = el.querySelector(".stamp.m");
  el.addEventListener("pointerdown", function(e){ on = true; moved = false; x0 = e.clientX; y0 = e.clientY; dx = dy = 0; el.classList.add("drag"); try { el.setPointerCapture(e.pointerId); } catch(_){} });
  el.addEventListener("pointermove", function(e){
    if (!on) return; dx = e.clientX - x0; dy = e.clientY - y0;
    if (Math.abs(dx) > 6 || Math.abs(dy) > 6) moved = true;
    if (!moved || RM) return;
    el.style.transform = "translate(" + dx + "px," + Math.min(dy, 0) * .6 + "px) rotate(" + dx / 22 + "deg)";
    if (flipped){ sk.style.opacity = Math.max(0, Math.min(1, dx / 90)); sm.style.opacity = Math.max(0, Math.min(1, -dx / 90)); }
  });
  function end(){
    if (!on) return; on = false; el.classList.remove("drag");
    sk.style.opacity = sm.style.opacity = 0;
    if (!moved){ flip(); return; }
    if (flipped && dx > 90) return rate("know");
    if (flipped && dx < -90) return rate("miss");
    el.style.transform = "";
    if (dy < -90 && Math.abs(dx) < 60) return ask();
    if (!flipped && Math.abs(dx) > 60) flip();
  }
  el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end);
}
function summary(stage){
  cur = null;
  var nxt = D.cards.map(function(c){ return rec(c.id).due; }).filter(function(x){ return x > now(); });
  var next = nxt.length ? Math.min.apply(null, nxt) : 0;
  var uniqM = sess.miss.filter(function(v, i, a){ return a.indexOf(v) === i; });
  var list = uniqM.map(function(id){ return "<li>" + esc(plain(side(card(id)).front)) + "</li>"; }).join("");
  var empty = !queue.length;
  stage.innerHTML =
    '<section class="sum">' +
      "<h2>" + esc(empty ? L("nothing_due") : L("done")) + "</h2>" +
      (empty ? "" : '<div class="tally"><div class="k"><b>' + sess.know.length + "</b><span>" + esc(L("know")) + '</span></div><div><b>' + sess.hard.length + "</b><span>" + esc(L("hard")) +
        '</span></div><div class="m"><b>' + uniqM.length + "</b><span>" + esc(L("again")) + "</span></div></div>") +
      (list ? "<h3>" + esc(L("to_review")) + "</h3><ol>" + list + "</ol>" : "") +
      (next ? '<p class="next">' + esc(L("next")) + ": <b>" + esc(date(next)) + "</b>. " + esc(L("leitner")) + "</p>" : "") +
      '<div class="row">' +
        (uniqM.length || D.cards.some(function(c){ return rec(c.id).miss > 0; }) ? '<button class="btn" data-go="missed">' + esc(L("review_missed")) + "</button>" : "") +
        '<button class="btn alt" data-go="all">' + esc(L("restart")) + "</button>" +
      "</div>" +
    "</section>";
  stage.querySelectorAll("[data-go]").forEach(function(b){ b.onclick = function(){ mode = b.getAttribute("data-go"); build(); }; });
}
function toast(m){ var t = document.getElementById("toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toast.h); toast.h = setTimeout(function(){ t.classList.remove("on"); }, 2200); }
/* клавиатура: пробел — перевернуть, → знаю, ← повторить, ↓ трудно, ↑ спросить */
document.addEventListener("keydown", function(e){
  if (e.target.tagName === "SELECT" || e.metaKey || e.ctrlKey || e.altKey || !cur) return;
  if (e.key === " " && e.target.tagName !== "BUTTON"){ e.preventDefault(); flip(); }
  else if (flipped && e.key === "ArrowRight"){ e.preventDefault(); rate("know"); }
  else if (flipped && e.key === "ArrowLeft"){ e.preventDefault(); rate("miss"); }
  else if (flipped && e.key === "ArrowDown"){ e.preventDefault(); rate("hard"); }
  else if (e.key === "ArrowUp"){ e.preventDefault(); ask(); }
});
var sel = document.getElementById("lang");
D.langs.forEach(function(lg){ var o = document.createElement("option"); o.value = lg; o.textContent = D.names[lg]; sel.appendChild(o); });
sel.value = lang;
sel.onchange = function(){ lang = sel.value; save(); render(); };
document.querySelectorAll("[data-mode]").forEach(function(b){ b.onclick = function(){ mode = b.getAttribute("data-mode"); build(); }; });
document.getElementById("shuf").onclick = function(){ var rest = queue.slice(pos); for (var i = rest.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = rest[i]; rest[i] = rest[j]; rest[j] = t; } queue = queue.slice(0, pos).concat(rest); render(); toast(L("shuffled")); };
build();
if (!queue.length && mode === "due"){ mode = "all"; build(); }
</script>
</body>
</html>
